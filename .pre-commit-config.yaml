repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        args: [src]
        pass_filenames: false
        additional_dependencies:
          - pydantic>=2.11,<3
          - pydantic-settings>=2.10,<3
          - sqlalchemy[asyncio]>=2.0.41,<3
